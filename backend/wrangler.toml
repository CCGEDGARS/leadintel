name = "leadintel-api"
main = "src/app.js"
compatibility_date = "2026-07-20"

[vars]
WORKSPACE_STORAGE_ENABLED = "true"
STRIPE_ACCOUNT_ID = "acct_1Gn4gwGqAtOWOEjZ"
STRIPE_LIVEMODE = "true"
STRIPE_STORAGE_BILLING_ENABLED = "false"
# Enable only after Price, VAT policy and restricted Worker secrets are configured.
# STRIPE_STORAGE_TAX_POLICY_READY = "true" after merchant tax review
# STRIPE_STORAGE_AUTOMATIC_TAX = "true" requires active Stripe Tax registration/settings and product code
# STRIPE_STORAGE_PLUS_PRICE_ID
# STRIPE_STORAGE_TAX_BEHAVIOR = "inclusive" or "exclusive" (must match configured Price)
# Secrets: STRIPE_RESTRICTED_KEY, STRIPE_WEBHOOK_SECRET

WRITING_REFERENCES_ALLOWED_WORKSPACES = "edgars-latvia"
# Who may manage sign-in invitations (/api/access/invitations). Sign-in itself is invitation-only for new identities.
PLATFORM_ADMIN_EMAILS = "edgars@ccgroup.lv,euntals@gmail.com,automations@futureleads.io"
AUTOMATIC_GMAIL_DELIVERY_MODE = "manual_only"
APPROVED_WORKFLOW_DELIVERY_MODE = "enabled"
APP_ORIGIN = "https://ccgedgars.github.io,https://leadintel.ccgroup.lv,https://leadintel-api.edgars-7e7.workers.dev"
SESSION_TTL_HOURS = "168"
CUSTOMER_APP_URL = "https://leadintel.ccgroup.lv/customer/"
GOOGLE_OAUTH_REDIRECT_URI = "https://leadintel-api.edgars-7e7.workers.dev/api/auth/google/callback"
GMAIL_OAUTH_REDIRECT_URI = "https://leadintel-api.edgars-7e7.workers.dev/api/integrations/gmail/callback"
MICROSOFT_OAUTH_REDIRECT_URI = "https://leadintel-api.edgars-7e7.workers.dev/api/auth/microsoft/callback"
MICROSOFT_MAIL_OAUTH_REDIRECT_URI = "https://leadintel-api.edgars-7e7.workers.dev/api/integrations/microsoft-mail/callback"
APOLLO_WEBHOOK_URL = "https://leadintel-api.edgars-7e7.workers.dev/api/webhooks/apollo/crm-contact"
SCRAPLING_SERVICE_URL = "https://leadintel-scrapling.onrender.com/api/scrapling"

# Secrets are configured with `wrangler secret put` and are never committed:
# GOOGLE_OAUTH_CLIENT_ID
# GOOGLE_OAUTH_CLIENT_SECRET
# MICROSOFT_OAUTH_CLIENT_ID
# MICROSOFT_OAUTH_CLIENT_SECRET
# OAUTH_TOKEN_ENCRYPTION_KEY (base64-encoded 32-byte AES key)
# APOLLO_API_KEY
# APOLLO_WEBHOOK_SECRET (optional dedicated callback-signing key; Apollo API key can be used as the server-side fallback)
# SCRAPLING_SERVICE_TOKEN (must match the protected Render service token)

[assets]
directory = "../v2"
binding = "ASSETS"
run_worker_first = true

[[d1_databases]]
binding = "DB"
database_name = "leadintel"
database_id = "79f8c0fb-82f9-4ff8-9ab7-38bf5742fc50"
migrations_dir = "migrations"

[[r2_buckets]]
binding = "WRITING_REFERENCES_BUCKET"
bucket_name = "leadintel-writing-reference"

[triggers]
crons = ["0 * * * *", "* * * * *"]
