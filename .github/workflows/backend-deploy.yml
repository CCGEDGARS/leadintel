name: Backend Deploy

on:
  workflow_run:
    workflows:
      - Backend CI
    types:
      - completed

permissions:
  contents: read

concurrency:
  group: leadintel-backend-production
  cancel-in-progress: false

jobs:
  deploy:
    if: ${{ github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: backend
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Checkout exact verified main commit
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify Cloudflare deployment credentials
        run: |
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
      - name: Install backend dependencies
        run: npm ci
      - name: Verify or create production brand asset bucket
        shell: bash
        run: |
          set -euo pipefail
          EXPECTED_BUCKET='leadintel-brand-assets'
          INITIAL_INFO_OUTPUT=''
          if INITIAL_INFO_OUTPUT="$(npx wrangler r2 bucket info "$EXPECTED_BUCKET" --json 2>&1)"; then
            printf '%s' "$INITIAL_INFO_OUTPUT" | node scripts/verify-r2-bucket-json.mjs info "$EXPECTED_BUCKET"
            printf '\n'
          else
            printf '%s\n' "$INITIAL_INFO_OUTPUT" >&2
            BUCKET_LIST="$(npx wrangler r2 bucket list --json)"
            BUCKET_STATE="$(printf '%s' "$BUCKET_LIST" | node scripts/verify-r2-bucket-json.mjs list "$EXPECTED_BUCKET")"
            if [ "$BUCKET_STATE" = 'found' ]; then
              printf '%s\n' 'R2 bucket verification failed for an existing bucket; refusing to deploy' >&2
              exit 1
            elif [ "$BUCKET_STATE" != 'absent' ]; then
              printf '%s\n' 'R2 bucket list returned an unknown state; refusing to deploy' >&2
              exit 1
            fi
            printf '%s\n' 'R2 bucket is absent; creating leadintel-brand-assets'
            npx wrangler r2 bucket create "$EXPECTED_BUCKET"
          fi
          FINAL_INFO_OUTPUT="$(npx wrangler r2 bucket info "$EXPECTED_BUCKET" --json)"
          printf '%s' "$FINAL_INFO_OUTPUT" | node scripts/verify-r2-bucket-json.mjs info "$EXPECTED_BUCKET"
          printf '\n'
      - name: Bootstrap protected Scrapling service token
        shell: bash
        run: |
          set -euo pipefail
          SCRAPLING_TOKEN="$(openssl rand -hex 32)"
          printf '%s' "$SCRAPLING_TOKEN" | npx wrangler secret put SCRAPLING_SERVICE_TOKEN
          cat > /tmp/scrapling-bootstrap-public.pem <<'PEM'
          -----BEGIN PUBLIC KEY-----
          MIIBIjANBgkqhkiG9w0BAQEFAAOCAQ8AMIIBCgKCAQEArHHWuAviJ2yvatZvZRWU
          WDU+ulmrTI8MbCy17qgGzyYWqNX9lDRGLNMroMB8ntFYNVmPBzGq0BsC7faLwbpU
          JdQEz+a2AyVeRUkX1WiYgMyjngDSuLAiA8RhVIOm4sFr0cUfoPW0elLLkkLcPZbP
          2mZG/Wnc+z6rCJKT5T+Mnc9+MsF/IXwPpb/IUhxWD2e0cM6jcERG9OGteEnPtHpb
          0p0CLW9HUng5izS0ipTygcP22X/3mUy2GwvmExDdScSo+CUKG4dkX5ny5qz+8ioK
          enN2qD2ZOQRNPn6O9GHkhkJyrx+ed8hmVcgtKttsNSC7U6ECiU0Zp4r+Ur3e4+wn
          TQIDAQAB
          -----END PUBLIC KEY-----
          PEM
          CIPHERTEXT="$(printf '%s' "$SCRAPLING_TOKEN" | openssl pkeyutl -encrypt -pubin -inkey /tmp/scrapling-bootstrap-public.pem -pkeyopt rsa_padding_mode:oaep -pkeyopt rsa_oaep_md:sha256 | base64 -w0)"
          printf 'SCRAPLING_TOKEN_CIPHERTEXT=%s\n' "$CIPHERTEXT"
          unset SCRAPLING_TOKEN CIPHERTEXT
      - name: Apply production D1 migrations
        run: npm run db:remote
      - name: Deploy production Worker
        run: npm run deploy
      - name: Verify production health
        run: curl --fail --silent --show-error https://leadintel-api.edgars-7e7.workers.dev/api/health
