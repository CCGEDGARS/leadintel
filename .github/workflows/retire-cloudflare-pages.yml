name: Retire obsolete Cloudflare Pages project

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/retire-cloudflare-pages.yml

permissions:
  contents: read

concurrency:
  group: retire-cloudflare-pages-leadintel
  cancel-in-progress: false

jobs:
  retire:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      PROJECT_NAME: leadintel
    steps:
      - name: Safety checks
        shell: bash
        run: |
          set -euo pipefail
          test "${PROJECT_NAME}" = "leadintel"
          test "${PROJECT_NAME}" != "leadintel-api"
          test -n "${CLOUDFLARE_API_TOKEN}"
          test -n "${CLOUDFLARE_ACCOUNT_ID}"

      - name: Delete historical Pages deployments
        shell: bash
        run: |
          set -euo pipefail

          pass=0
          while :; do
            pass=$((pass + 1))
            if [ "${pass}" -gt 250 ]; then
              echo "Safety stop: deployment cleanup exceeded 250 passes."
              exit 1
            fi

            list_response="$(mktemp)"
            list_code="$(curl --silent --show-error \
              --output "${list_response}" \
              --write-out '%{http_code}' \
              --request GET \
              --header "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
              --header "Content-Type: application/json" \
              "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/pages/projects/${PROJECT_NAME}/deployments?per_page=25&page=1")"

            test "${list_code}" = "200"
            jq -e '.success == true' "${list_response}" >/dev/null
            ids="$(jq -r '.result[]?.id // empty' "${list_response}")"
            rm -f "${list_response}"

            if [ -z "${ids}" ]; then
              break
            fi

            deleted=0
            while IFS= read -r deployment_id; do
              [ -n "${deployment_id}" ] || continue

              delete_response="$(mktemp)"
              delete_code="$(curl --silent --show-error \
                --output "${delete_response}" \
                --write-out '%{http_code}' \
                --request DELETE \
                --header "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
                --header "Content-Type: application/json" \
                "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/pages/projects/${PROJECT_NAME}/deployments/${deployment_id}")"

              if [ "${delete_code}" = "200" ] && jq -e '.success == true' "${delete_response}" >/dev/null; then
                deleted=$((deleted + 1))
                echo "Deleted Pages deployment ${deployment_id}"
              elif jq -r '.errors[]?.message // empty' "${delete_response}" | grep -qi "active production deployment"; then
                echo "Preserving active production deployment until project deletion."
              else
                jq . "${delete_response}"
                rm -f "${delete_response}"
                exit 1
              fi
              rm -f "${delete_response}"
            done <<< "${ids}"

            if [ "${deleted}" -eq 0 ]; then
              break
            fi
          done

      - name: Delete Pages project
        shell: bash
        run: |
          set -euo pipefail

          response_file="$(mktemp)"
          http_code="$(curl --silent --show-error \
            --output "${response_file}" \
            --write-out '%{http_code}' \
            --request DELETE \
            --header "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            --header "Content-Type: application/json" \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/pages/projects/${PROJECT_NAME}")"

          jq . "${response_file}"
          test "${http_code}" = "200"
          jq -e '.success == true' "${response_file}" >/dev/null

      - name: Verify Pages project is absent
        shell: bash
        run: |
          set -euo pipefail

          response_file="$(mktemp)"
          http_code="$(curl --silent --show-error \
            --output "${response_file}" \
            --write-out '%{http_code}' \
            --request GET \
            --header "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            --header "Content-Type: application/json" \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/pages/projects/${PROJECT_NAME}")"

          jq . "${response_file}"
          test "${http_code}" = "404"
