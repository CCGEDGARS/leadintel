name: Customer V2 CI

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - 'feature/**'
    paths:
      - 'customer/**'
      - 'backend/src/customer-state.js'
      - 'backend/src/crm.js'
      - 'backend/src/crm-routes.js'
      - 'backend/migrations/0011_master_crm.sql'
      - 'scripts/build-vercel-static.sh'
      - 'scripts/release-integrity-core.mjs'
      - 'scripts/verify-release-integrity.mjs'
      - 'release-integrity.config.json'
      - 'vercel.json'
      - 'index.html'
      - 'v2/index.html'
      - 'README.md'
      - '.github/workflows/customer-ci.yml'
      - '.github/workflows/release-integrity.yml'
  pull_request:
    paths:
      - 'customer/**'
      - 'backend/src/customer-state.js'
      - 'backend/src/crm.js'
      - 'backend/src/crm-routes.js'
      - 'backend/migrations/0011_master_crm.sql'
      - 'scripts/build-vercel-static.sh'
      - 'scripts/release-integrity-core.mjs'
      - 'scripts/verify-release-integrity.mjs'
      - 'release-integrity.config.json'
      - 'vercel.json'
      - 'index.html'
      - 'v2/index.html'
      - 'README.md'
      - '.github/workflows/customer-ci.yml'
      - '.github/workflows/release-integrity.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run customer tests
        run: node --test customer/test/*.test.js
      - name: Check JavaScript syntax
        run: |
          node --check backend/src/customer-state.js
          node --check backend/src/crm.js
          node --check backend/src/crm-routes.js
          node --check customer/profile-engine.js
          node --check customer/market-engine.js
          node --check customer/discovery-engine.js
          node --check customer/outreach-engine.js
          node --check customer/delivery-engine.js
          node --check customer/company-research-engine.js
          node --check customer/company-research-security.js
          node --check customer/company-research-ui.js
          node --check customer/company-profile-handoff.js
          node --check customer/state-budget.js
          node --check customer/website-input-sync.js
          node --check customer/website-activation.js
          node --check customer/crm-engine.js
          node --check customer/crm-ui.js
          node --check customer/app.js
          node --check customer/process-map.js
          node --check customer/ai-settings.js
          node --check customer/discovery-ui.js
          node --check customer/outreach-ui.js
          node --check customer/delivery-ui.js
          node --check customer/server-bridge.js
          node --check customer/production-gmail-ui.js
          node --check scripts/release-integrity-core.mjs
          node --check scripts/verify-release-integrity.mjs
