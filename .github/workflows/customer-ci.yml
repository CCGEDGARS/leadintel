name: Customer V2 CI

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - 'feature/**'
    paths:
      - 'customer/**'
      - 'backend/**'
      - 'scripts/build-vercel-static.sh'
      - 'scripts/verify-discovery-deploy.mjs'
      - 'scripts/release-integrity-core.mjs'
      - 'scripts/verify-release-integrity.mjs'
      - 'release-integrity.config.json'
      - 'vercel.json'
      - 'index.html'
      - 'v2/index.html'
      - 'README.md'
      - 'AGENTS.md'
      - '.agents/skills/leadintel-market-intelligence/**'
      - '.agents/skills/release-integrity/**'
      - '.agents/skills/release-verification/SKILL.md'
      - 'docs/release-integrity-template.md'
      - 'docs/superpowers/specs/2026-08-31-release-provenance.md'
      - '.github/workflows/customer-ci.yml'
      - '.github/workflows/backend-ci.yml'
      - '.github/workflows/backend-deploy.yml'
      - '.github/workflows/release-integrity.yml'
  pull_request:
    paths:
      - 'customer/**'
      - 'backend/**'
      - 'scripts/build-vercel-static.sh'
      - 'scripts/verify-discovery-deploy.mjs'
      - 'scripts/release-integrity-core.mjs'
      - 'scripts/verify-release-integrity.mjs'
      - 'release-integrity.config.json'
      - 'vercel.json'
      - 'index.html'
      - 'v2/index.html'
      - 'README.md'
      - 'AGENTS.md'
      - '.agents/skills/leadintel-market-intelligence/**'
      - '.agents/skills/release-integrity/**'
      - '.agents/skills/release-verification/SKILL.md'
      - 'docs/release-integrity-template.md'
      - 'docs/superpowers/specs/2026-08-31-release-provenance.md'
      - '.github/workflows/customer-ci.yml'
      - '.github/workflows/backend-ci.yml'
      - '.github/workflows/backend-deploy.yml'
      - '.github/workflows/release-integrity.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run customer tests
        shell: bash
        run: |
          set +e
          node --test customer/test/*.test.js 2>&1 | tee customer-test-output.txt
          status=${PIPESTATUS[0]}
          exit $status
      - name: Upload customer test diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: customer-test-diagnostics-${{ github.sha }}
          path: customer-test-output.txt
          retention-days: 3
      - name: Check JavaScript syntax
        run: |
          node --check backend/src/customer-state.js
          node --check backend/src/crm.js
          node --check backend/src/crm-routes.js
          node --check customer/profile-engine.js
          node --check customer/canonical-intelligence.js
          node --check customer/canonical-profile-runtime.js
          node --check customer/intelligence-profile-ui.js
          node --check customer/intelligence-profile-runtime.js
          node --check customer/reference-customers.js
          node --check customer/reference-customer-ui.js
          node --check customer/lookalike-discovery.js
          node --check customer/evidence-view.js
          node --check customer/market-engine.js
          node --check customer/linkedin-signals.js
          node --check customer/discovery-engine.js
          node --check customer/outreach-engine.js
          node --check customer/delivery-engine.js
          node --check customer/company-research-engine.js
          node --check customer/company-research-security.js
          node --check customer/company-research-ui.js
          node --check customer/company-profile-handoff.js
          node --check customer/state-budget.js
          node --check customer/workspace-persistence.js
          node --check customer/website-input-sync.js
          node --check customer/website-activation.js
          node --check customer/firecrawl-workspace-router.js
          node --check customer/crm-engine.js
          node --check customer/crm-ui.js
          node --check customer/app.js
          node --check customer/process-map.js
          node --check customer/ai-settings.js
          node --check customer/discovery-ui.js
          node --check customer/outreach-ui.js
          node --check customer/delivery-ui.js
          node --check customer/server-bridge.js
          node --check customer/production-gmail-ui.js
          node --check customer/copilot-loader.js
          node --check customer/copilot-api.js
          node --check customer/copilot-context.js
          node --check customer/copilot-ui.js
          node --check scripts/release-integrity-core.mjs
          node --check scripts/verify-discovery-deploy.mjs
          node --check scripts/verify-release-integrity.mjs
