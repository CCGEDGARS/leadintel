name: Customer V2 CI

on:
  push:
    branches:
      - 'feature/customer-v2-*'
    paths:
      - 'customer/**'
      - 'backend/src/customer-state.js'
      - '.github/workflows/customer-ci.yml'
      - '.github/workflows/deploy-pages.yml'
  pull_request:
    paths:
      - 'customer/**'
      - 'backend/src/customer-state.js'
      - '.github/workflows/customer-ci.yml'
      - '.github/workflows/deploy-pages.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run customer tests
        run: node --test customer/test/*.test.js
      - name: Check JavaScript syntax
        run: |
          node --check backend/src/customer-state.js
          node --check customer/profile-engine.js
          node --check customer/market-engine.js
          node --check customer/discovery-engine.js
          node --check customer/outreach-engine.js
          node --check customer/delivery-engine.js
          node --check customer/company-research-engine.js
          node --check customer/company-research-security.js
          node --check customer/company-research-ui.js
          node --check customer/company-profile-handoff.js
          node --check customer/state-budget.js
          node --check customer/website-input-sync.js
          node --check customer/app.js
          node --check customer/process-map.js
          node --check customer/ai-settings.js
          node --check customer/discovery-ui.js
          node --check customer/outreach-ui.js
          node --check customer/delivery-ui.js
          node --check customer/server-bridge.js
          node --check customer/production-gmail-ui.js