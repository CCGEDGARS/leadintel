name: Customer V2 CI

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - 'feature/**'
    paths:
      - 'demo/**'
      - 'customer/**'
      - 'admin/**'
      - 'backend/**'
      - 'proxy.js'
      - 'scripts/build-vercel-static.sh'
      - 'scripts/verify-step1-journey.mjs'
      - 'scripts/verify-step5-journey.mjs'
      - 'scripts/verify-step6-journey.mjs'
      - 'scripts/verify-step7-journey.mjs'
      - 'package.json'
      - 'package-lock.json'
      - 'scripts/verify-discovery-deploy.mjs'
      - 'scripts/release-integrity-core.mjs'
      - 'scripts/verify-release-integrity.mjs'
      - 'scripts/verify-worker-propagation.mjs'
      - 'release-integrity.config.json'
      - 'deployment-authority.json'
      - 'vercel.json'
      - 'index.html'
      - 'v2/index.html'
      - 'README.md'
      - 'AGENTS.md'
      - '.agents/skills/leadintel-market-intelligence/**'
      - '.agents/skills/release-integrity/**'
      - '.agents/skills/release-verification/SKILL.md'
      - 'docs/release-integrity-template.md'
      - 'docs/superpowers/specs/2026-08-31-release-provenance.md'
      - '.github/workflows/customer-ci.yml'
      - '.github/workflows/backend-ci.yml'
      - '.github/workflows/backend-deploy.yml'
      - '.github/workflows/release-integrity.yml'
  pull_request:
    paths:
      - 'demo/**'
      - 'customer/**'
      - 'admin/**'
      - 'backend/**'
      - 'proxy.js'
      - 'scripts/build-vercel-static.sh'
      - 'scripts/verify-step1-journey.mjs'
      - 'scripts/verify-step5-journey.mjs'
      - 'scripts/verify-step6-journey.mjs'
      - 'scripts/verify-step7-journey.mjs'
      - 'package.json'
      - 'package-lock.json'
      - 'scripts/verify-discovery-deploy.mjs'
      - 'scripts/release-integrity-core.mjs'
      - 'scripts/verify-release-integrity.mjs'
      - 'scripts/verify-worker-propagation.mjs'
      - 'release-integrity.config.json'
      - 'deployment-authority.json'
      - 'vercel.json'
      - 'index.html'
      - 'v2/index.html'
      - 'README.md'
      - 'AGENTS.md'
      - '.agents/skills/leadintel-market-intelligence/**'
      - '.agents/skills/release-integrity/**'
      - '.agents/skills/release-verification/SKILL.md'
      - 'docs/release-integrity-template.md'
      - 'docs/superpowers/specs/2026-08-31-release-provenance.md'
      - '.github/workflows/customer-ci.yml'
      - '.github/workflows/backend-ci.yml'
      - '.github/workflows/backend-deploy.yml'
      - '.github/workflows/release-integrity.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned customer and integration dependencies
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm ci --prefix backend --ignore-scripts --no-audit --no-fund
      - name: Run customer tests
        shell: bash
        run: |
          set +e
          node --test customer/test/*.test.js 2>&1 | tee customer-test-output.txt
          status=${PIPESTATUS[0]}
          exit $status
      - name: Upload customer test diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: customer-test-diagnostics-${{ github.sha }}
          path: customer-test-output.txt
          retention-days: 3
      - name: Check JavaScript syntax
        run: |
          node --check proxy.js
          node --check backend/src/customer-state.js
          node --check backend/src/crm.js
          node --check backend/src/crm-routes.js
          node --check customer/profile-engine.js
          node --check customer/canonical-intelligence.js
          node --check customer/canonical-profile-runtime.js
          node --check customer/intelligence-profile-ui.js
          node --check customer/intelligence-profile-runtime.js
          node --check customer/reference-customers.js
          node --check customer/reference-customer-ui.js
          node --check customer/lookalike-discovery.js
          node --check customer/evidence-view.js
          node --check customer/market-engine.js
          node --check customer/market-research-verification.js
          node --check customer/linkedin-signals.js
          node --check customer/discovery-engine.js
          node --check customer/message-editor.js
          node --check customer/message-studio.js
          node --check customer/message-workspace.js
          node --check customer/outreach-engine.js
          node --check customer/delivery-engine.js
          node --check customer/company-research-engine.js
          node --check customer/company-research-security.js
          node --check customer/company-research-ui.js
          node --check customer/company-profile-handoff.js
          node --check customer/state-budget.js
          node --check customer/workspace-persistence.js
          node --check customer/workspace-codec-worker.js
          node --check customer/website-input-sync.js
          node --check customer/website-activation.js
          node --check customer/firecrawl-workspace-router.js
          node --check customer/crm-engine.js
          node --check customer/crm-ui.js
          node --check customer/app.js
          node --check customer/process-map.js
          node --check customer/ai-settings.js
          node --check customer/discovery-ui.js
          node --check customer/outreach-ui.js
          node --check customer/delivery-ui.js
          node --check customer/server-bridge.js
          node --check customer/production-gmail-ui.js
          node --check customer/copilot-loader.js
          node --check customer/copilot-api.js
          node --check customer/copilot-context.js
          node --check customer/copilot-ui.js
          node --check demo/demo.js
          node --check scripts/release-integrity-core.mjs
          node --check scripts/verify-discovery-deploy.mjs
          node --check scripts/verify-release-integrity.mjs

  buyers-journey:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@v6
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned browser and backend dependencies
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm ci --prefix backend --ignore-scripts --no-audit --no-fund
      - name: Install Chromium for authenticated journey acceptance
        run: |
          npx playwright-core install --with-deps chromium
          node --input-type=module - <<'JS'
          import {chromium} from 'playwright-core';
          import {appendFileSync} from 'node:fs';
          appendFileSync(process.env.GITHUB_ENV, 'LEADINTEL_CHROMIUM_PATH='+chromium.executablePath()+'\n');
          JS
      - name: Verify Setup, Buyers, Messages and Delivery through authenticated persistence and browser reloads
        env:
          LEADINTEL_REQUIRE_BROWSER: 'true'
        # Each journey launches Chromium. Keep the existing timeouts and assertions
        # while avoiding four competing browser processes on the same runner.
        run: node --import ./backend/test/register-wasm-loader.mjs --test --test-concurrency=1 backend/test/step1-journey.test.mjs backend/test/step5-journey.test.mjs backend/test/step6-journey.test.mjs backend/test/step7-journey.test.mjs
      - name: Upload controlled journey evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: step5-browser-acceptance-${{ github.sha }}
          path: |
            /tmp/leadintel-step1-test-*/evidence.json
            /tmp/leadintel-step1-test-*/*.png
            /tmp/leadintel-step5-test-*/evidence.json
            /tmp/leadintel-step5-test-*/*.png
            /tmp/leadintel-step6-test-*/evidence.json
            /tmp/leadintel-step6-test-*/*.png
            /tmp/leadintel-step7-test-*/evidence.json
            /tmp/leadintel-step7-test-*/*.png
          if-no-files-found: warn
          retention-days: 14
