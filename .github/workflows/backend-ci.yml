name: Backend CI

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - 'feature/**'
    paths:
      - 'backend/**'
      - 'api/**'
      - 'requirements.txt'
      - 'release-integrity.config.json'
      - 'scripts/verify-release-integrity.mjs'
      - '.github/workflows/release-integrity.yml'
      - '.github/workflows/backend-ci.yml'
      - '.github/workflows/backend-deploy.yml'
  pull_request:
    paths:
      - 'backend/**'
      - 'api/**'
      - 'requirements.txt'
      - 'release-integrity.config.json'
      - 'scripts/verify-release-integrity.mjs'
      - '.github/workflows/release-integrity.yml'
      - '.github/workflows/backend-ci.yml'
      - '.github/workflows/backend-deploy.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install backend dependencies
        run: npm ci
      - name: Audit production dependencies at high severity
        run: npm audit --omit=dev --audit-level=high
      - name: Audit all dependencies at critical severity
        run: npm audit --audit-level=critical
      - name: Run backend tests
        run: npm test
      - name: Check Scrapling Python syntax
        run: python -m py_compile ../api/scrapling.py
      - name: Check backend JavaScript syntax
        run: |
          node --check src/app.js
          node --check src/index.js
          node --check src/security.js
          node --check src/oauth.js
          node --check src/customer-state.js
          node --check src/gmail.js
          node --check src/microsoft-mail.js
          node --check src/saas-routes.js
          node --check src/crm.js
          node --check src/crm-routes.js
          node --check src/apollo-crm-webhook.js
          node --check src/ai-provider.js
          node --check src/ai-routes.js
          node --check src/canonical.js
          node --check src/enrichment.js
          node --check src/quality.js
          node --check src/runs.js
          node --check src/scrapling.js
          node --check src/scrapling-routes.js
          node --check src/copilot-security.js
          node --check src/copilot-context.js
          node --check src/copilot-knowledge.js
          node --check src/copilot-skills.js
          node --check src/copilot-diagnostics.js
          node --check src/copilot-memory.js
          node --check src/copilot-actions.js
          node --check src/copilot-service.js
          node --check src/copilot-routes.js
