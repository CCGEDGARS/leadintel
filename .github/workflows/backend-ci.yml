name: Backend CI

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - 'feature/**'
    paths:
      - 'backend/**'
      - '.github/workflows/backend-ci.yml'
  pull_request:
    paths:
      - 'backend/**'
      - '.github/workflows/backend-ci.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install backend dependencies
        run: npm ci
      - name: Audit high-severity dependencies
        run: npm audit --audit-level=high
      - name: Run backend tests
        run: npm test
      - name: Check backend JavaScript syntax
        run: |
          node --check src/app.js
          node --check src/index.js
          node --check src/security.js
          node --check src/oauth.js
          node --check src/customer-state.js
          node --check src/gmail.js
          node --check src/saas-routes.js
          node --check src/crm.js
          node --check src/crm-routes.js
          node --check src/apollo-crm-webhook.js
          node --check src/ai-provider.js
          node --check src/ai-routes.js
          node --check src/canonical.js
          node --check src/enrichment.js
          node --check src/quality.js
          node --check src/runs.js
