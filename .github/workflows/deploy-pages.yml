name: Deploy LeadIntel

on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'LeadIntel.html'
      - 'CNAME'
      - '.nojekyll'
      - 'v2/**'
      - 'customer/**'
      - '.github/workflows/deploy-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Build safe Pages artifact
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .pages
          mkdir -p .pages/v2 .pages/customer
          cp index.html .pages/index.html
          cp LeadIntel.html .pages/LeadIntel.html
          cp CNAME .pages/CNAME
          cp .nojekyll .pages/.nojekyll
          cp -R v2/. .pages/v2/
          cp -R customer/. .pages/customer/

      - name: Upload LeadIntel site
        uses: actions/upload-pages-artifact@v4
        with:
          path: './.pages'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
