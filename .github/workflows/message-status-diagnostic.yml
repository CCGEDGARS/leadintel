name: Message status diagnosis
on:
  push:
    branches: [diagnose/message-master-status]
permissions:
  contents: read
jobs:
  status:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Inspect approved recipient checks without printing customer contents
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          node --input-type=module <<'NODE'
          import {readOwnedPayload} from './backend/src/workspace-record-store.js';
          import {createRequire} from 'node:module';
          const require=createRequire(import.meta.url), Discovery=require('./customer/discovery-engine.js');
          async function query(sql,params=[]){if(!/^SELECT /i.test(sql))throw Error('Read-only queries required');const r=await fetch('https://api.cloudflare.com/client/v4/accounts/'+process.env.CLOUDFLARE_ACCOUNT_ID+'/d1/database/79f8c0fb-82f9-4ff8-9ab7-38bf5742fc50/query',{method:'POST',headers:{Authorization:'Bearer '+process.env.CLOUDFLARE_API_TOKEN,'Content-Type':'application/json'},body:JSON.stringify({sql,params})});const data=await r.json();if(!r.ok||!data.success)throw Error('Read-only query failed, HTTP '+r.status);return data.result[0].results;}
          const DB={prepare(sql){let args=[];return {bind(...values){args=values;return this;},async all(){return {results:await query(sql,args)};}};}};
          const row=(await query('SELECT workspace_id,version,payload_json FROM customer_workspace_state WHERE workspace_id=?',['edgars-latvia']))[0];
          const {payload:p}=await readOwnedPayload({DB},'edgars-latvia',row);
          const choice=p.meta?.discovery?.scriptBuyer,prospects=p.discovery?.selectedProspects||[],candidate=prospects.find(c=>c.domain===choice?.domain),person=candidate?.people?.find(x=>x.id===choice?.personId),identity=choice?.recipientIdentity;
          const contacts=choice?.contactId?await query('SELECT * FROM crm_contacts WHERE workspace_id=? AND id=?',['edgars-latvia',choice.contactId]):[],contact=contacts[0];
          const item=p.outreach?.items?.find(x=>x.domain===choice?.domain&&x.selectedPersonId===choice?.personId&&x.channel===choice?.channel),draftIdentity=item?.messageStudioDraft?.recipientIdentity;
          const text=x=>String(x||'').trim().replace(/\s+/g,' ').toLowerCase(),same=(a,b)=>text(a)===text(b);
          console.log(JSON.stringify({check:'hydrated_recipient_status',version:row.version,step:p.main?.step,visibleStep:p.meta?.discovery?.visibleStep,choicePresent:!!choice,choiceChannel:choice?.channel,workspaceMatches:choice?.workspaceId==='edgars-latvia',candidatePresent:!!candidate,personPresent:!!person,personKept:!!person?.kept,identityPresent:identity?.version===1,crmContactPresent:!!contact,draftPresent:!!item,
          identityChecks:identity&&person?{personId:String(identity.personId)===String(person.id),companyDomain:same(identity.companyDomain,candidate.domain),companyName:same(identity.companyName,candidate.company),name:same(identity.name,person.publicName||person.name),title:same(identity.title,person.title),organization:same(identity.organization,person.organization),linkedin:identity.linkedinUrl===(Discovery.normalizeLinkedInUrl(person.publicLinkedinUrl||person.linkedin_url)||''),sourceUrl:String(identity.identitySourceUrl||'')===String(person.publicNameUrl||''),researchKey:identity.researchKey===Discovery.buyerResearchIdentityKey(candidate,person),companyId:!candidate.crmId||identity.companyId===candidate.crmId}:null,
          crmChecks:contact&&person?{companyId:contact.company_id===identity?.companyId,externalPersonId:!contact.external_person_id||String(contact.external_person_id)===String(person.id),name:same(contact.name,person.publicName||person.name),title:!person.title||same(contact.title,person.title),email:same(contact.work_email||contact.normalized_email,choice.email)}:null,
          holds:person?{rolesChanged:!!candidate.buyerRolesChanged,identityPending:person.identityStatus==='pending',namePending:person.nameVerification==='pending',scopeReview:person.opportunityScope?.status==='review_required',conflicts:(candidate.publicResearch?.conflicts||[]).filter(x=>String(x.person_id)===String(person.id)).length}:null,
          draftChecks:item?{hasSavedRecipientIdentity:!!draftIdentity,recipientIdentityMatches:!draftIdentity||JSON.stringify(draftIdentity)===JSON.stringify(identity),hasLibrarySource:!!item.messageStudioDraft?.channelLibrarySource,style:item.messageStudioDraft?.mode,oldStoryBody:String(item.drafts?.emailBody||'').includes('Suppose'),saved:!!item.messageStudioDraft?.scriptSavedAt,manual:item.messageStudioDraft?.editorOrigin==='manual'}:null}));
          
          const Policy=require('./customer/contact-confirmation-policy.js'),savedPerson=item?.dossier?.people?.find(x=>String(x.id)===String(choice?.personId));
          const aliases=r=>[r?.linkedin_url,r?.public_linkedin_url,r?.linkedinUrl,r?.publicLinkedinUrl,r?.linkedinConfirmedUrl,r?.linkedin,r?.profile?.linkedinUrl].filter(x=>String(x||'').trim());
          const profilesOk=r=>aliases(r).every(x=>Discovery.normalizeLinkedInUrl(x)===identity?.linkedinUrl);
          console.log(JSON.stringify({check:'remaining_recipient_checks',contactAcceptedPublic:Policy.accepted(contact,candidate.domain,'public_confirmed'),contactAcceptedProvider:Policy.accepted(contact,candidate.domain,'provider_verified'),personProfilesAgree:profilesOk(person),contactProfilesAgree:profilesOk(contact),savedPersonPresent:!!savedPerson,savedNameMatches:same(savedPerson?.publicName||savedPerson?.name,identity?.name),savedTitleMatches:same(savedPerson?.title,identity?.title),savedOrganizationMatches:same(savedPerson?.organization,identity?.organization),savedProfilesAgree:profilesOk(savedPerson),savedEmailMatches:!String(savedPerson?.email||savedPerson?.work_email||savedPerson?.normalized_email||'').trim()||same(savedPerson?.email||savedPerson?.work_email||savedPerson?.normalized_email,choice.email)}));
          
          NODE

# Read-only diagnostic retry; output remains limited to status flags.
