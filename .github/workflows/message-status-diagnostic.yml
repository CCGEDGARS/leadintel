name: Message status diagnosis
on:
  push:
    branches: [diagnose/message-master-status]
permissions:
  contents: read
jobs:
  status:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Read bounded template and recipient status only
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          node --input-type=module <<'NODE'
          const queries=[["master_status","SELECT id,revision,json_extract(payload_json,'$.deleted') AS deleted,json_extract(payload_json,'$.creatorSource.revision') AS creator_revision,length(json_extract(payload_json,'$.body')) AS body_length,json_extract(payload_json,'$.subject')='When the handover stalls' AS old_story_subject,instr(json_extract(payload_json,'$.body'),'Suppose')>0 AS hypothetical_body FROM core_script_registry WHERE id IN ('email:professional','email:curiosity','email:friendly','email:brutal','email:storyselling','linkedin:professional','linkedin:curiosity','linkedin:friendly','linkedin:brutal','linkedin:storyselling','phone:professional','phone:curiosity','phone:friendly','phone:brutal','phone:storyselling') ORDER BY id"],["source_counts","SELECT json_extract(payload_json,'$.channel') AS channel,json_extract(payload_json,'$.style') AS style,count(*) AS source_count,sum(CASE WHEN json_extract(payload_json,'$.deleted') THEN 1 ELSE 0 END) AS deleted_count FROM creator_script_library GROUP BY channel,style LIMIT 20"],["saved_state_status","SELECT version,updated_at,json_extract(payload_json,'$.main.step') AS step,json_type(payload_json,'$.meta.discovery.scriptBuyer') AS choice_type,json_type(payload_json,'$.discovery.selectedProspects') AS prospects_type,json_type(payload_json,'$.outreach.items') AS drafts_type FROM customer_workspace_state WHERE workspace_id='edgars-latvia'"],["saved_choice_checks","SELECT json_extract(s.payload_json,'$.meta.discovery.scriptBuyer.channel') AS channel,json_extract(s.payload_json,'$.meta.discovery.scriptBuyer.workspaceId')=s.workspace_id AS workspace_matches,json_type(s.payload_json,'$.meta.discovery.scriptBuyer.recipientIdentity') AS identity_type,c.id IS NOT NULL AS crm_contact_exists,lower(trim(c.work_email))=lower(trim(json_extract(s.payload_json,'$.meta.discovery.scriptBuyer.email'))) AS email_matches,lower(trim(c.name))=lower(trim(json_extract(s.payload_json,'$.meta.discovery.scriptBuyer.recipientIdentity.name'))) AS name_matches,lower(trim(c.title))=lower(trim(json_extract(s.payload_json,'$.meta.discovery.scriptBuyer.recipientIdentity.title'))) AS title_matches FROM customer_workspace_state s LEFT JOIN crm_contacts c ON c.id=json_extract(s.payload_json,'$.meta.discovery.scriptBuyer.contactId') WHERE s.workspace_id='edgars-latvia'"]];
          for(const [check,sql] of queries){const response=await fetch('https://api.cloudflare.com/client/v4/accounts/'+process.env.CLOUDFLARE_ACCOUNT_ID+'/d1/database/79f8c0fb-82f9-4ff8-9ab7-38bf5742fc50/query',{method:'POST',headers:{Authorization:'Bearer '+process.env.CLOUDFLARE_API_TOKEN,'Content-Type':'application/json'},body:JSON.stringify({sql})});const data=await response.json();if(!response.ok||!data.success){console.log(JSON.stringify({check,failed:true,status:response.status}));process.exitCode=1;continue;}console.log(JSON.stringify({check,results:data.result.map(r=>r.results)}));}
          NODE
