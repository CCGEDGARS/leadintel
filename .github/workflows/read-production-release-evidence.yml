name: Read production release evidence
on: pull_request
permissions:
  actions: read
jobs:
  find-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    env:
      GH_TOKEN: ${{ github.token }}
      EXPECTED_SHA: ${{ github.event.pull_request.base.sha }}
    steps:
      - name: Locate exact GitHub Actions verification
        shell: bash
        run: |
          set -euo pipefail
          for attempt in {1..42}; do
            for workflow in customer-ci.yml backend-deploy.yml release-integrity.yml; do
              gh api "repos/$GITHUB_REPOSITORY/actions/workflows/$workflow/runs?branch=main&head_sha=$EXPECTED_SHA&per_page=12" --jq '.workflow_runs[] | [.name,.id,.status,.conclusion] | @tsv'
            done
            runs=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/release-integrity.yml/runs?branch=main&head_sha=$EXPECTED_SHA&status=completed&per_page=12" --jq '.workflow_runs[] | select(.conclusion=="success") | .id')
            for run in $runs; do
              jobs=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run/jobs" --jq '.jobs[] | select(.name=="prove-production" and .conclusion=="success") | .id')
              for job in $jobs; do
                gh api "repos/$GITHUB_REPOSITORY/actions/jobs/$job/logs" > "$RUNNER_TEMP/production-proof-job.log" || continue
                if python3 - "$RUNNER_TEMP/production-proof-job.log" "$EXPECTED_SHA" <<'PY'
          import json, re, sys
          from pathlib import Path
          log = Path(sys.argv[1]).read_text(errors="replace")
          stripped = "\n".join(re.sub(r"^\S+\s", "", line) for line in log.splitlines())
          proof = re.search(r"^LEADINTEL_RELEASE_PROOF_BEGIN\s*\n([\s\S]*?)^LEADINTEL_RELEASE_PROOF_END", stripped, flags=re.M)
          if not proof:
              sys.exit(1)
          p = json.loads(proof[1])
          if p.get("verdict") != "PROVEN" or p["expected"]["sha"] != sys.argv[2]:
              sys.exit(1)
          print(json.dumps({k: p[k] for k in ("verdict", "environment", "expected", "manifest", "ci")}))
          PY
                then
                  echo "EXACT_RELEASE_PROOF_RUN=$run JOB=$job"
                  exit 0
                fi
              done
            done
            sleep 15
          done
          exit 1
