name: Backend dependency upgrade

on:
  push:
    branches:
      - 'feature/customer-v2-production-saas'
    paths:
      - '.github/workflows/backend-deps-upgrade.yml'

permissions:
  contents: write

jobs:
  upgrade:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v6
        with:
          ref: feature/customer-v2-production-saas
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Upgrade Wrangler and verify audit
        working-directory: backend
        run: |
          npm install --save-dev --save-exact wrangler@4.125.0
          npm audit --audit-level=high
      - name: Commit deterministic lockfile update
        run: |
          if git diff --quiet -- backend/package.json backend/package-lock.json; then
            echo "No dependency changes required"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/package.json backend/package-lock.json
          git commit -m "chore(deps): upgrade Wrangler to 4.125.0"
          git push origin HEAD:feature/customer-v2-production-saas
