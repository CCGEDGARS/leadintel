name: Export source for architecture audit

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/source-audit.yml

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Package tracked source
        run: git archive --format=zip --output=leadintel-source.zip HEAD
      - uses: actions/upload-artifact@v4
        with:
          name: leadintel-source
          path: leadintel-source.zip
          retention-days: 1
